<!-- ============================================================
     TRADE LINE — Stats (v1)
     Animated counters — driven by js/main.js [data-count] contract.
     Bilingual AR/EN — Arabic default (RTL). Logical properties.
     ============================================================ -->

<section class="tl-section tl-stats" aria-labelledby="stats-heading">
  <h2 id="stats-heading" class="tl-visually-hidden" data-ar="إحصائياتنا" data-en="Our Statistics">إحصائياتنا</h2>

  <div class="tl-container">
    <div class="tl-grid tl-grid--4">
      <div class="tl-stats__item" data-aos="fade-up">
        <p class="tl-stats__number" data-count="15" data-count-suffix="+">15+</p>
        <p class="tl-stats__label" data-ar="عاماً من الخبرة" data-en="Years of Experience">عاماً من الخبرة</p>
      </div>

      <div class="tl-stats__item" data-aos="fade-up" data-aos-delay="100">
        <p class="tl-stats__number" data-count="40" data-count-suffix="+">40+</p>
        <p class="tl-stats__label" data-ar="دولة نخدمها" data-en="Countries Served">دولة نخدمها</p>
      </div>

      <div class="tl-stats__item" data-aos="fade-up" data-aos-delay="200">
        <p class="tl-stats__number" data-count="1200" data-count-suffix="+">1200+</p>
        <p class="tl-stats__label" data-ar="شحنة سنوياً" data-en="Shipments Per Year">شحنة سنوياً</p>
      </div>

      <div class="tl-stats__item" data-aos="fade-up" data-aos-delay="300">
        <p class="tl-stats__number" data-count="500" data-count-suffix="+">500+</p>
        <p class="tl-stats__label" data-ar="شريك موثوق" data-en="Trusted Partners">شريك موثوق</p>
      </div>
    </div>
  </div>
</section>
