<!-- ============================================================
     TRADE LINE — Icon System (v1)
     Shared SVG sprite — ALL site icons as <symbol> definitions.
     One visual family: 24x24 viewBox, 2px stroke, round caps/joins.

     HOW TO USE
     1. INLINE this sprite once per page, right after <body> opens
        (before the header component). It is hidden — no visual impact.
     2. Reference any icon anywhere with:
        <svg class="tl-icon" aria-hidden="true"><use href="#tl-icon-import"/></svg>
     3. Include icons.css in <head> (after tokens.css, before component
        CSS) for the shared .tl-icon base class + size variants.
     4. Filled brand glyphs (WhatsApp) use the .tl-icon--fill modifier.
     5. RTL-aware arrows use .tl-icon--arrow (flips via CSS).
     ============================================================ -->
